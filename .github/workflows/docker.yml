name: Docker

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "templates/**"
      - "documents/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "templates/**"
      - "documents/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/start-linux.sh
      - name: Check the app is serving the API and the frontend
        run: |
          curl --fail --silent --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8000/api/health
          curl --fail --silent --output /dev/null http://localhost:8000/
          curl --fail --silent --output /dev/null http://localhost:8000/login/
          curl --fail --silent --output /dev/null http://localhost:8000/signup/
          curl --fail --silent --output /dev/null http://localhost:8000/documents/
      - name: Check that an account can be created and that only its owner gets in
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8000/api/documents)" = 401
          curl --fail --silent --cookie-jar cookies.txt --header "Content-Type: application/json" \
            --data '{"email": "ci@example.com", "password": "correct horse"}' http://localhost:8000/api/signup
          curl --fail --silent --cookie cookies.txt http://localhost:8000/api/me
          curl --fail --silent --cookie cookies.txt http://localhost:8000/api/documents
      - run: scripts/stop-linux.sh
        if: always()
